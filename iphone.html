<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-soft: #fafafa;
    --text: #1d1d1f;
    --text-muted: #6e6e73;
    --border: #d2d2d7;
    --border-strong: #86868b;
    --accent: #0071e3;
    --accent-soft: #e8f2fc;
    --bb-bg: #eef2ff;
    --bb-text: #3730a3;
    --bb-border: #c7d2fe;
    --sh-bg: #fff7ed;
    --sh-text: #9a3412;
    --sh-border: #fed7aa;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.04);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
  }

  .app {
    max-width: 680px;
    margin: 0 auto;
    padding: 12px 14px 32px;
  }

  .topbar {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .app-icon-badge {
    width: 42px;
    height: 42px;
    border-radius: 11px;
    background: linear-gradient(145deg, #1d1e52, #0f172a);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(15, 23, 42, 0.25);
  }

  h1#studyTitle {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    cursor: pointer;
  }
  p#studySubtitle {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
  }

  .header-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn {
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn-danger { color: #d93025; border-color: #f3b7b3; }

  .files-dropdown {
    display: none;
    background: var(--surface);
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .files-dropdown.open { display: block; }
  .files-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .file-card {
    background: var(--surface-soft);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .file-card label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .file-card input, .file-card textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    background: #fff;
    color: var(--text);
  }
  .file-card-actions { display: flex; gap: 6px; justify-content: flex-end; }

  .subjects-section {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .section-title {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .legend-inline {
    display: flex;
    gap: 10px;
    font-size: 11px;
    color: var(--text-muted);
    align-items: center;
  }
  .legend-box-dashed {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px dashed var(--accent);
    border-radius: 3px;
    vertical-align: middle;
    margin-right: 4px;
  }
  .legend-box-solid {
    display: inline-block;
    width: 12px;
    height: 12px;
    background: var(--accent);
    border-radius: 3px;
    vertical-align: middle;
    margin-right: 4px;
  }

  .subjects-strip {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .all-subjects-card {
    min-width: 145px;
    background: var(--surface-soft);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .all-subjects-card.active-filter { border: 2px solid var(--accent); background: var(--accent-soft); }

  .subject-card {
    min-width: 205px;
    max-width: 225px;
    background: #fff;
    border: 1.5px solid var(--border);
    border-left-width: 5px;
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .subject-card.selected {
    background: #f8fbff;
    box-shadow: 0 0 0 2px var(--accent);
  }

  .subj-code-pill {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 5px;
    color: #fff;
    margin-bottom: 2px;
  }
  .subj-name { font-size: 13.5px; font-weight: 700; line-height: 1.2; }
  .subj-progress {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    background: #f2f2f7;
    padding: 2px 6px;
    border-radius: 5px;
  }
  .cond-stack { display: flex; flex-direction: column; gap: 3px; }
  .cond-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    padding: 3px 6px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface-soft);
  }
  .cond-tag { font-weight: 700; font-size: 10.5px; padding: 1px 5px; border-radius: 4px; }
  .cond-bb { background: var(--bb-bg); color: var(--bb-text); border: 1px solid var(--bb-border); }
  .cond-sh { background: var(--sh-bg); color: var(--sh-text); border: 1px solid var(--sh-border); }

  .calendar-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 10px 16px;
    box-shadow: var(--shadow);
  }
  .cal-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 6px;
    padding: 0 4px;
  }
  .cal-month-title {
    font-size: 16px;
    font-weight: 700;
    text-transform: capitalize;
  }
  .cal-nav { display: flex; gap: 4px; }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
    margin-bottom: 6px;
  }
  .weekday {
    text-align: center;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
  }

  .day-cell {
    min-height: 68px;
    background: #fff;
    border: 1.5px solid #e5e5ea;
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;
    overflow: hidden;
  }
  .day-cell.other-month { background: #fafafa; opacity: 0.45; }
  .day-cell.today .day-num {
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    padding: 1px 5px;
  }
  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    font-weight: 700;
  }
  .session-dot-top {
    font-size: 8px;
    font-weight: 800;
    background: rgba(255,255,255,0.9);
    color: #1d1d1f;
    padding: 0 3px;
    border-radius: 3px;
  }
  .ev-badge {
    font-size: 9.5px;
    font-weight: 700;
    padding: 2px 4px;
    border-radius: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ev-diary {
    background: rgba(255,255,255,0.94);
    border: 1px dashed currentColor;
  }
  .ev-session {
    background: rgba(255,255,255,0.96);
    color: #1d1d1f !important;
  }

  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.42);
    backdrop-filter: blur(3px);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }

  .modal-box {
    background: #fff;
    border-radius: 18px 18px 0 0;
    width: 100%;
    max-width: 680px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
  }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ececef;
    padding-bottom: 10px;
    margin-bottom: 12px;
  }
  .modal-head h3 { margin: 0; font-size: 16px; }
  .close-btn {
    background: #f2f2f7;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    color: var(--text);
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 11px;
  }
  .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .form-group input, .form-group select, .form-group textarea {
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 9px 10px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: #fff;
  }

  .color-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2.5px solid transparent; }
  .swatch.active { border-color: #1d1d1f; transform: scale(1.1); }

  .session-clean-box {
    border: 1.5px solid var(--border);
    border-left-width: 6px;
    border-radius: 12px;
    padding: 13px;
    background: var(--surface-soft);
    margin-bottom: 12px;
  }
  .btn-whatsapp {
    background: #25d366;
    color: #fff;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 9px;
    font-size: 13px;
    margin: 8px 0 10px;
  }
  .diary-block {
    border: 1.5px dashed var(--border-strong);
    border-radius: 12px;
    padding: 12px;
    background: #fff;
    margin-bottom: 12px;
  }
  .check-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 600;
    padding: 5px 0;
  }
  .check-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
  .reminder-box { margin-top: 10px; padding-top: 10px; border-top: 1px solid #ececef; }
  .reminder-controls { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .reminder-controls select, .reminder-controls input[type="time"] {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 7px 8px;
    font-family: inherit;
    font-size: 13px;
    background: #fff;
  }

  .all-subj-item {
    border: 1.5px solid var(--border);
    border-left-width: 5px;
    border-radius: 11px;
    padding: 11px 12px;
    margin-bottom: 10px;
    background: #fff;
  }
  .status-pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .status-done { background: #dcfce7; color: #166534; }
  .status-active { background: #dbeafe; color: #1e40af; }

  .alarm-popup {
    display: none;
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom));
    left: 14px;
    right: 14px;
    background: #fff;
    border: 2px solid var(--accent);
    border-radius: 15px;
    padding: 14px 16px;
    box-shadow: 0 14px 32px rgba(0,0,0,0.2);
    z-index: 2000;
  }
  .alarm-popup.open { display: block; }
</style>
</head>

<script>
  const PALETTE = [
    "#2563eb", "#059669", "#d97706", "#7c3aed",
    "#db2777", "#0891b2", "#dc2626", "#4f46e5",
    "#65a30d", "#ea580c"
  ];

  const STORAGE_KEYS = {
    SUBJECTS: "morfeo_v3_subjects",
    CHECKS: "morfeo_v3_checks",
    NOTES: "morfeo_v3_day_notes",
    REMINDERS: "morfeo_v3_reminders",
    FILES: "morfeo_v3_files",
    TITLE: "morfeo_v3_title",
    SUBTITLE: "morfeo_v3_subtitle"
  };

  let subjects = JSON.parse(localStorage.getItem(STORAGE_KEYS.SUBJECTS) || "[]");
  let checks = JSON.parse(localStorage.getItem(STORAGE_KEYS.CHECKS) || "{}");
  let dayNotes = JSON.parse(localStorage.getItem(STORAGE_KEYS.NOTES) || "{}");
  let reminders = JSON.parse(localStorage.getItem(STORAGE_KEYS.REMINDERS) || "[]");
  let filesData = JSON.parse(localStorage.getItem(STORAGE_KEYS.FILES) || '{"diary":"","recruit":"","msg":""}');

  let currentMonthDate = new Date();
  currentMonthDate.setDate(1);
  let selectedSubjectFilter = null;
  let selectedSwatchColor = PALETTE[0];
  let activeDayStr = null;
  let lastTriggeredReminder = null;

  function saveAll() {
    localStorage.setItem(STORAGE_KEYS.SUBJECTS, JSON.stringify(subjects));
    localStorage.setItem(STORAGE_KEYS.CHECKS, JSON.stringify(checks));
    localStorage.setItem(STORAGE_KEYS.NOTES, JSON.stringify(dayNotes));
    localStorage.setItem(STORAGE_KEYS.REMINDERS, JSON.stringify(reminders));
    localStorage.setItem(STORAGE_KEYS.FILES, JSON.stringify(filesData));
  }

  function formatDateISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function parseISO(str) {
    const [y, m, d] = str.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function addDays(isoStr, delta) {
    const d = parseISO(isoStr);
    d.setDate(d.getDate() + delta);
    return formatDateISO(d);
  }

  function formatItShort(isoStr) {
    if (!isoStr) return "—";
    const [y, m, d] = isoStr.split("-");
    return `${d}/${m}`;
  }

  function formatItFull(isoStr) {
    const d = parseISO(isoStr);
    return d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }

  function initEditableHeader() {
    const titleEl = document.getElementById("studyTitle");
    const subEl = document.getElementById("studySubtitle");
    const savedTitle = localStorage.getItem(STORAGE_KEYS.TITLE);
    const savedSub = localStorage.getItem(STORAGE_KEYS.SUBTITLE);
    if (savedTitle) titleEl.textContent = savedTitle;
    if (savedSub) subEl.textContent = savedSub;

    titleEl.addEventListener("click", () => {
      const next = prompt("Modifica titolo:", titleEl.textContent);
      if (next && next.trim()) {
        titleEl.textContent = next.trim();
        localStorage.setItem(STORAGE_KEYS.TITLE, next.trim());
      }
    });

    subEl.addEventListener("click", () => {
      const next = prompt("Modifica sottotitolo:", subEl.textContent);
      if (next && next.trim()) {
        subEl.textContent = next.trim();
        localStorage.setItem(STORAGE_KEYS.SUBTITLE, next.trim());
      }
    });
  }

  function initFilesDropdown() {
    const diaryInp = document.getElementById("linkDiaryInput");
    const recInp = document.getElementById("linkRecruitInput");
    const msgInp = document.getElementById("msgNotesInput");

    diaryInp.value = filesData.diary || "";
    recInp.value = filesData.recruit || "";
    msgInp.value = filesData.msg || "";

    const sync = () => {
      filesData.diary = diaryInp.value.trim();
      filesData.recruit = recInp.value.trim();
      filesData.msg = msgInp.value;
      saveAll();
    };
    diaryInp.addEventListener("input", sync);
    recInp.addEventListener("input", sync);
    msgInp.addEventListener("input", sync);

    document.getElementById("btnToggleFiles").addEventListener("click", () => {
      document.getElementById("filesDropdown").classList.toggle("open");
    });
  }

  function copyField(id) {
    const val = document.getElementById(id).value.trim();
    if (!val) return alert("Il campo è vuoto.");
    navigator.clipboard.writeText(val);
    alert("Link copiato!");
  }

  function openUrlField(id) {
    const val = document.getElementById(id).value.trim();
    if (!val) return alert("Inserisci prima un link.");
    window.open(val.startsWith("http") ? val : "https://" + val, "_blank");
  }

  function copyMessageTemplate() {
    const link = filesData.diary || "[Link Diario]";
    const raw = filesData.msg && filesData.msg.trim()
      ? filesData.msg
      : "Ciao! Ti ricordo di compilare il Diario del Sonno di oggi al seguente link: {LINK}";
    const finalMsg = raw.includes("{LINK}") ? raw.replace(/\{LINK\}/g, link) : `${raw}\n${link}`;
    navigator.clipboard.writeText(finalMsg);
    alert("Messaggio copiato!");
  }

  function getScheduleEvents() {
    const events = [];
    subjects.forEach((s) => {
      const sessions = [
        { num: 1, date: s.s1Date, cond: s.s1Cond },
        { num: 2, date: s.s2Date, cond: s.s2Cond }
      ];
      sessions.forEach((sess) => {
        if (!sess.date) return;
        events.push({
          type: "diary",
          diaryDay: 1,
          sessionNum: sess.num,
          cond: sess.cond,
          date: addDays(sess.date, -2),
          subject: s,
          checkKey: `${s.id}_S${sess.num}_D1`
        });
        events.push({
          type: "diary",
          diaryDay: 2,
          sessionNum: sess.num,
          cond: sess.cond,
          date: addDays(sess.date, -1),
          subject: s,
          checkKey: `${s.id}_S${sess.num}_D2`
        });
        events.push({
          type: "session",
          diaryDay: 3,
          sessionNum: sess.num,
          cond: sess.cond,
          date: sess.date,
          subject: s,
          checkKey: `${s.id}_S${sess.num}_D3`
        });
      });
    });
    return events;
  }

  function getSubjectCompletion(subj) {
    let total = 0;
    let done = 0;
    [1, 2].forEach((num) => {
      const dt = num === 1 ? subj.s1Date : subj.s2Date;
      if (dt) {
        total += 3;
        if (checks[`${subj.id}_S${num}_D1`]) done++;
        if (checks[`${subj.id}_S${num}_D2`]) done++;
        if (checks[`${subj.id}_S${num}_D3`]) done++;
      }
    });
    return { done, total };
  }

  function isSubjectCompleted(subj) {
    const today = formatDateISO(new Date());
    const lastDate = subj.s2Date || subj.s1Date;
    const { done, total } = getSubjectCompletion(subj);
    if (total > 0 && done === total) return true;
    if (lastDate && lastDate < today) return true;
    return false;
  }

  function renderSubjectsStrip() {
    const strip = document.getElementById("subjectsStrip");
    strip.innerHTML = "";

    const allCard = document.createElement("div");
    allCard.className = "all-subjects-card" + (selectedSubjectFilter === null ? " active-filter" : "");
    allCard.innerHTML = `
      <div>
        <div style="font-size:13px; font-weight:700;">👥 Tutti</div>
        <div style="font-size:11.5px; color:var(--text-muted); margin-top:3px;">${subjects.length} soggetti</div>
      </div>
      <button class="btn btn-sm" style="margin-top:8px;" onclick="event.stopPropagation(); openAllSubjectsModal()">Lista completa</button>
    `;
    allCard.addEventListener("click", () => {
      selectedSubjectFilter = null;
      renderAll();
    });
    strip.appendChild(allCard);

    subjects.forEach((s) => {
      const { done, total } = getSubjectCompletion(s);
      const card = document.createElement("div");
      card.className = "subject-card" + (selectedSubjectFilter === s.id ? " selected" : "");
      card.style.borderLeftColor = s.color;
      const s1Tag = s.s1Cond === "BB" ? "cond-bb" : "cond-sh";
      const s2Tag = s.s2Cond === "BB" ? "cond-bb" : "cond-sh";

      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6px;">
          <div>
            <span class="subj-code-pill" style="background:${s.color};">${escapeHtml(s.code || "SOGG")}</span>
            <div class="subj-name">${escapeHtml(s.name)}</div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:3px;">
            <span class="subj-progress">${done}/${total}</span>
            <button class="btn btn-sm" style="padding:2px 6px; font-size:11px;" onclick="event.stopPropagation(); openEditSubject('${s.id}')">✏️</button>
          </div>
        </div>
        <div class="cond-stack">
          <div class="cond-line">
            <span><strong>S1:</strong> ${formatItShort(s.s1Date)}</span>
            <span class="cond-tag ${s1Tag}">${s.s1Cond}</span>
          </div>
          <div class="cond-line">
            <span><strong>S2:</strong> ${formatItShort(s.s2Date)}</span>
            <span class="cond-tag ${s2Tag}">${s.s2Cond}</span>
          </div>
        </div>
      `;
      card.addEventListener("click", () => {
        selectedSubjectFilter = selectedSubjectFilter === s.id ? null : s.id;
        renderAll();
      });
      strip.appendChild(card);
    });
  }

  function renderCalendar() {
    const year = currentMonthDate.getFullYear();
    const month = currentMonthDate.getMonth();
    document.getElementById("calMonthTitle").textContent = currentMonthDate.toLocaleDateString("it-IT", {
      month: "long",
      year: "numeric"
    });

    const grid = document.getElementById("calGrid");
    grid.innerHTML = "";

    const firstDayOfMonth = new Date(year, month, 1);
    let startOffset = firstDayOfMonth.getDay() - 1;
    if (startOffset < 0) startOffset = 6;

    const startDate = new Date(year, month, 1 - startOffset);
    const todayISO = formatDateISO(new Date());

    let allEvents = getScheduleEvents();
    if (selectedSubjectFilter) {
      allEvents = allEvents.filter((e) => e.subject.id === selectedSubjectFilter);
    }

    for (let i = 0; i < 42; i++) {
      const cellDate = new Date(startDate);
      cellDate.setDate(startDate.getDate() + i);
      const iso = formatDateISO(cellDate);
      const inMonth = cellDate.getMonth() === month;

      const dayEvents = allEvents.filter((e) => e.date === iso);
      const sessionEvents = dayEvents.filter((e) => e.type === "session");
      const diaryOnlyEvents = dayEvents.filter((e) => e.type === "diary");

      const cell = document.createElement("div");
      cell.className = "day-cell" + (!inMonth ? " other-month" : "") + (iso === todayISO ? " today" : "");

      if (sessionEvents.length > 0) {
        if (sessionEvents.length === 1) {
          const c = sessionEvents[0].subject.color;
          cell.style.background = c;
          cell.style.borderColor = c;
          cell.style.color = "#fff";
        } else {
          const c1 = sessionEvents[0].subject.color;
          const c2 = sessionEvents[1].subject.color;
          cell.style.background = `linear-gradient(135deg, ${c1} 50%, ${c2} 50%)`;
          cell.style.borderColor = c1;
          cell.style.color = "#fff";
        }
      } else if (diaryOnlyEvents.length > 0) {
        const c = diaryOnlyEvents[0].subject.color;
        cell.style.border = `2px dashed ${c}`;
        cell.style.background = "#ffffff";
      }

      const header = document.createElement("div");
      header.className = "day-header";
      header.innerHTML = `<span class="day-num">${cellDate.getDate()}</span>` +
        (sessionEvents.length > 0 ? `<span class="session-dot-top">SESS</span>` : "");
      cell.appendChild(header);

      dayEvents.slice(0, 3).forEach((ev) => {
        const badge = document.createElement("div");
        const codeLabel = ev.subject.code || ev.subject.name.split(" ")[0];
        if (ev.type === "session") {
          badge.className = "ev-badge ev-session";
          badge.textContent = `${codeLabel} S${ev.sessionNum}[${ev.cond}]`;
        } else {
          badge.className = "ev-badge ev-diary";
          badge.style.color = ev.subject.color;
          badge.textContent = `${codeLabel} D${ev.diaryDay}`;
        }
        cell.appendChild(badge);
      });

      cell.addEventListener("click", () => openDayModal(iso));
      grid.appendChild(cell);
    }
  }

  function openDayModal(isoStr) {
    activeDayStr = isoStr;
    document.getElementById("dayModalTitle").textContent = formatItFull(isoStr);
    const container = document.getElementById("dayModalContent");
    container.innerHTML = "";

    const allEvents = getScheduleEvents().filter((e) => e.date === isoStr);
    const sessionEvents = allEvents.filter((e) => e.type === "session");
    const diaryEvents = allEvents.filter((e) => e.type === "diary");

    if (allEvents.length === 0) {
      container.innerHTML = `<p style="color:var(--text-muted); font-size:14px;">Nessuna sessione o diario in questa data.</p>`;
    }

    sessionEvents.forEach((ev) => {
      const s = ev.subject;
      const noteKey = `sess_${s.id}_${isoStr}`;
      const condLabel = ev.cond === "BB" ? "BB (Binaural Beats)" : "SHAM";
      const condClass = ev.cond === "BB" ? "cond-bb" : "cond-sh";
      const cleanPhone = (s.phone || "").replace(/[^0-9]/g, "");
      const waUrl = cleanPhone ? `https://wa.me/${cleanPhone}` : "";

      const box = document.createElement("div");
      box.className = "session-clean-box";
      box.style.borderLeftColor = s.color;
      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <strong style="font-size:15.5px;">${escapeHtml(s.code ? s.code + " · " : "")}${escapeHtml(s.name)}</strong>
          <span class="cond-tag ${condClass}">${condLabel}</span>
        </div>
        <div style="font-size:13px; color:var(--text-muted); margin-top:6px;">📱 ${s.phone ? escapeHtml(s.phone) : "Nessun numero"}</div>
        ${waUrl ? `<a class="btn-whatsapp" href="${waUrl}" target="_blank" rel="noopener">💬 Apri WhatsApp</a>` : ""}
        <div class="form-group" style="margin-bottom:0;">
          <label>Note sessione</label>
          <textarea rows="2" placeholder="Note sessione..." oninput="saveDayNote('${noteKey}', this.value)">${escapeHtml(dayNotes[noteKey] || "")}</textarea>
        </div>
      `;
      container.appendChild(box);
    });

    if (diaryEvents.length > 0) {
      const dBox = document.createElement("div");
      dBox.className = "diary-block";
      let checksHtml = `<div style="font-weight:700; font-size:13.5px; margin-bottom:6px;">🌙 Diari del Sonno</div>`;
      diaryEvents.forEach((ev) => {
        const checked = checks[ev.checkKey] ? "checked" : "";
        checksHtml += `
          <label class="check-row">
            <input type="checkbox" ${checked} onchange="toggleCheck('${ev.checkKey}', this.checked)" />
            <span style="color:${ev.subject.color};">●</span>
            <span>${escapeHtml(ev.subject.code || "")} ${escapeHtml(ev.subject.name)} — D${ev.diaryDay}/3 (S${ev.sessionNum})</span>
          </label>
        `;
      });

      let optionsHtml = "";
      diaryEvents.forEach((ev) => {
        const label = `${ev.subject.code || ev.subject.name} · D${ev.diaryDay}/3`;
        optionsHtml += `<option value="${escapeHtml(label)}">${escapeHtml(label)}</option>`;
      });

      const dayReminders = reminders.filter((r) => r.date === isoStr);
      let remListHtml = "";
      if (dayReminders.length > 0) {
        remListHtml = `<div style="margin-top:8px; display:flex; flex-direction:column; gap:5px;">`;
        dayReminders.forEach((r) => {
          remListHtml += `
            <div style="display:flex; justify-content:space-between; align-items:center; background:#f5f5f7; padding:6px 9px; border-radius:8px; font-size:12px;">
              <span>⏰ <strong>${r.time}</strong> — ${escapeHtml(r.label)}</span>
              <button class="btn btn-sm btn-danger" style="padding:2px 6px;" onclick="deleteReminder('${r.id}')">✕</button>
            </div>
          `;
        });
        remListHtml += `</div>`;
      }

      dBox.innerHTML = checksHtml + `
        <div class="reminder-box">
          <div style="font-weight:700; font-size:12.5px;">🔔 Promemoria diario</div>
          <div class="reminder-controls">
            <select id="remDiarySelect">${optionsHtml}</select>
            <input type="time" id="remTimeInput" value="21:00" />
            <button type="button" class="btn btn-primary btn-sm" onclick="addDiaryReminder('${isoStr}')">Salva</button>
            <button type="button" class="btn btn-sm" onclick="exportSingleIcs('${isoStr}')">📲 .ics</button>
          </div>
          ${remListHtml}
        </div>
      `;
      container.appendChild(dBox);
    }

    openModal("dayModal");
  }

  function toggleCheck(key, val) {
    checks[key] = val;
    saveAll();
    renderSubjectsStrip();
    renderCalendar();
  }

  function saveDayNote(key, val) {
    dayNotes[key] = val;
    saveAll();
  }

  function addDiaryReminder(isoStr) {
    const label = document.getElementById("remDiarySelect").value;
    const time = document.getElementById("remTimeInput").value;
    if (!time) return;
    reminders.push({ id: "rem_" + Date.now(), date: isoStr, time, label });
    saveAll();
    openDayModal(isoStr);
  }

  function deleteReminder(id) {
    reminders = reminders.filter((r) => r.id !== id);
    saveAll();
    if (activeDayStr) openDayModal(activeDayStr);
  }

  function exportSingleIcs(isoStr) {
    const label = document.getElementById("remDiarySelect").value;
    const time = document.getElementById("remTimeInput").value || "21:00";
    const [hh, mm] = time.split(":");
    const cleanDate = isoStr.replace(/-/g, "");
    const dtStart = `${cleanDate}T${hh}${mm}00`;
    const dtEnd = `${cleanDate}T${hh}${String(Math.min(59, Number(mm) + 15)).padStart(2, "0")}00`;
    const link = filesData.diary || "";

    const icsContent = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//MORFEO Thesis Planner//IT",
      "BEGIN:VEVENT",
      `UID:morfeo-${Date.now()}@thesisplanner`,
      `DTSTAMP:${cleanDate}T080000Z`,
      `DTSTART:${dtStart}`,
      `DTEND:${dtEnd}`,
      `SUMMARY:🌙 Diario del Sonno · ${label}`,
      `DESCRIPTION:Invia o compila il Diario del Sonno (${label}). ${link}`,
      "BEGIN:VALARM",
      "TRIGGER:-PT0M",
      "ACTION:DISPLAY",
      `DESCRIPTION:Promemoria Diario del Sonno: ${label}`,
      "END:VALARM",
      "END:VEVENT",
      "END:VCALENDAR"
    ].join("\n");

    const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `promemoria_diario_${isoStr}.ics`;
    a.click();
    URL.revokeObjectURL(url);
  }

  setInterval(() => {
    const now = new Date();
    const todayISO = formatDateISO(now);
    const hhmm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    const match = reminders.find((r) => r.date === todayISO && r.time === hhmm);
    if (match && lastTriggeredReminder !== match.id + "_" + hhmm) {
      lastTriggeredReminder = match.id + "_" + hhmm;
      showAlarmPopup(`È l'ora (${match.time}) per: ${match.label}!`);
    }
  }, 15000);

  function showAlarmPopup(text) {
    document.getElementById("alarmPopupText").textContent = text;
    document.getElementById("alarmPopup").classList.add("open");
  }
  function closeAlarmPopup() { document.getElementById("alarmPopup").classList.remove("open"); }
  function snoozeAlarm() {
    closeAlarmPopup();
    setTimeout(() => showAlarmPopup("Posticipo terminato! Ricordati il Diario del Sonno."), 10 * 60 * 1000);
  }

  function renderSwatches() {
    const wrap = document.getElementById("colorSwatches");
    wrap.innerHTML = "";
    PALETTE.forEach((c) => {
      const el = document.createElement("div");
      el.className = "swatch" + (selectedSwatchColor === c ? " active" : "");
      el.style.background = c;
      el.addEventListener("click", () => {
        selectedSwatchColor = c;
        renderSwatches();
      });
      wrap.appendChild(el);
    });
  }

  function suggestNextCode() {
    return "S" + String(subjects.length + 1).padStart(2, "0");
  }

  document.getElementById("btnNewSubject").addEventListener("click", () => {
    document.getElementById("subjectModalTitle").textContent = "Nuovo Soggetto";
    document.getElementById("editSubjectId").value = "";
    document.getElementById("subjCode").value = suggestNextCode();
    document.getElementById("subjName").value = "";
    document.getElementById("subjPhone").value = "";
    document.getElementById("s1Date").value = formatDateISO(new Date());
    document.getElementById("s1Cond").value = "BB";
    document.getElementById("s2Date").value = "";
    document.getElementById("s2Cond").value = "SH";
    document.getElementById("subjNotes").value = "";
    selectedSwatchColor = PALETTE[subjects.length % PALETTE.length];
    document.getElementById("btnDeleteSubject").style.display = "none";
    renderSwatches();
    openModal("subjectModal");
  });

  function openEditSubject(id) {
    const s = subjects.find((x) => x.id === id);
    if (!s) return;
    document.getElementById("subjectModalTitle").textContent = "Modifica Soggetto";
    document.getElementById("editSubjectId").value = s.id;
    document.getElementById("subjCode").value = s.code || "";
    document.getElementById("subjName").value = s.name;
    document.getElementById("subjPhone").value = s.phone || "";
    document.getElementById("s1Date").value = s.s1Date || "";
    document.getElementById("s1Cond").value = s.s1Cond || "BB";
    document.getElementById("s2Date").value = s.s2Date || "";
    document.getElementById("s2Cond").value = s.s2Cond || "SH";
    document.getElementById("subjNotes").value = s.notes || "";
    selectedSwatchColor = s.color || PALETTE[0];
    const delBtn = document.getElementById("btnDeleteSubject");
    delBtn.style.display = "inline-flex";
    delBtn.onclick = () => {
      if (confirm(`Eliminare ${s.name}?`)) {
        subjects = subjects.filter((x) => x.id !== id);
        if (selectedSubjectFilter === id) selectedSubjectFilter = null;
        saveAll();
        closeModal("subjectModal");
        renderAll();
      }
    };
    renderSwatches();
    openModal("subjectModal");
  }

  document.getElementById("subjectForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const editId = document.getElementById("editSubjectId").value;
    const payload = {
      id: editId || "subj_" + Date.now(),
      code: document.getElementById("subjCode").value.trim(),
      name: document.getElementById("subjName").value.trim(),
      phone: document.getElementById("subjPhone").value.trim(),
      s1Date: document.getElementById("s1Date").value,
      s1Cond: document.getElementById("s1Cond").value,
      s2Date: document.getElementById("s2Date").value,
      s2Cond: document.getElementById("s2Cond").value,
      color: selectedSwatchColor,
      notes: document.getElementById("subjNotes").value.trim()
    };
    if (editId) {
      subjects = subjects.map((s) => (s.id === editId ? payload : s));
    } else {
      subjects.push(payload);
    }
    saveAll();
    closeModal("subjectModal");
    renderAll();
  });

  function openAllSubjectsModal() {
    const list = document.getElementById("allSubjectsList");
    if (subjects.length === 0) {
      list.innerHTML = `<p style="color:var(--text-muted); font-size:13.5px;">Nessun soggetto reclutato.</p>`;
    } else {
      list.innerHTML = "";
      subjects.forEach((s) => {
        const done = isSubjectCompleted(s);
        const { done: dCount, total: tCount } = getSubjectCompletion(s);
        const item = document.createElement("div");
        item.className = "all-subj-item";
        item.style.borderLeftColor = s.color;
        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
            <strong>${escapeHtml(s.code ? s.code + " · " : "")}${escapeHtml(s.name)}</strong>
            <span class="status-pill ${done ? "status-done" : "status-active"}">${done ? "✓ Fatto" : `${dCount}/${tCount}`}</span>
          </div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">
            S1: <strong>${formatItShort(s.s1Date)}</strong> (${s.s1Cond}) · S2: <strong>${formatItShort(s.s2Date)}</strong> (${s.s2Cond})
          </div>
          ${s.phone ? `<div style="font-size:12px; color:var(--text-muted); margin-top:3px;">📱 ${escapeHtml(s.phone)}</div>` : ""}
          <div style="display:flex; gap:6px; margin-top:8px;">
            <button class="btn btn-sm" onclick="selectedSubjectFilter='${s.id}'; closeModal('allSubjectsModal'); renderAll();">Filtra</button>
            <button class="btn btn-sm" onclick="closeModal('allSubjectsModal'); openEditSubject('${s.id}');">Modifica</button>
          </div>
        `;
        list.appendChild(item);
      });
    }
    openModal("allSubjectsModal");
  }

  function openModal(id) { document.getElementById(id).classList.add("open"); }
  function closeModal(id) { document.getElementById(id).classList.remove("open"); }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  document.getElementById("btnPrevMonth").addEventListener("click", () => {
    currentMonthDate.setMonth(currentMonthDate.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById("btnNextMonth").addEventListener("click", () => {
    currentMonthDate.setMonth(currentMonthDate.getMonth() + 1);
    renderCalendar();
  });
  document.getElementById("btnToday").addEventListener("click", () => {
    currentMonthDate = new Date();
    currentMonthDate.setDate(1);
    renderCalendar();
  });

  function renderAll() {
    renderSubjectsStrip();
    renderCalendar();
  }

  initEditableHeader();
  initFilesDropdown();
  renderAll();
</script>
</body>
</html>
